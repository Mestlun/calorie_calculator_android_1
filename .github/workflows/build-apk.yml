name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest build-tools;34.0.0 platform-tools'

      - name: Make gradlew executable
        # working-directory: ./имя_папки_проекта # Раскомментируйте и укажите папку, если gradlew не в корне
        run: chmod +x gradlew

      - name: Build APK
        # working-directory: ./имя_папки_проекта # Раскомментируйте и укажите папку, если gradlew не в корне
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-calculator-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
